# Default configuration preset for Remi Suite
# Location: %APPDATA%/remi-suite-py/remi-py.toml

[engine]
type = "whisper_cpp"
local_model = "large-v3-turbo-q5_0"
asr_port = 9177
language = "hinglish"
device = "auto"                    # "auto" detects NVIDIA CUDA, falls back to CPU
bench_mode = false                 # Set to true to print per-stage latency table after each command

[llm]
enabled = true                     # Auto-resolves unknown voice queries with local SLM/LLM
backend = "auto"                   # "auto" probes Ollama (11434), LM Studio (1234), llama.cpp (8080)
endpoint = "http://127.0.0.1:11434"
# Recommended for RTX 4050 (6GB VRAM) alongside Whisper:
#   llama3.2:3b  (default) - fast, strong reasoning, tool-call capable
#   qwen2.5:3b   - excellent Hinglish understanding
#   qwen2.5:0.5b - ultra-low latency fallback
model = "llama3.2:3b"
timeout_seconds = 12
temperature = 0.1

[browser]
hotkey = "ctrl+alt+b"
cdp_port = 9222
auto_launch_browser = true
browser_profile = "remi"           # "remi" creates isolated profile; "default" reuses main
voice_feedback = true

[dictation]
hotkey = "ctrl+alt+space"
delivery_mode = "paste"            # "paste" (fastest via Ctrl+V), "type" (SendInput keys), or "clipboard"
writing_mode = "smart"             # "smart" applies punctuation capitalization; "verbatim" is raw
language = "hinglish"
max_recording_seconds = 120
