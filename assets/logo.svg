<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#11131D"/>
      <stop offset="100%" stop-color="#1A1D2E"/>
    </linearGradient>
    <linearGradient id="remiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle background -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="url(#remiGrad)" stroke-width="8" opacity="0.65"/>

  <!-- Centered Mic + Soundwave Emblem -->
  <g transform="translate(256, 256)" filter="url(#glow)">
    <!-- Outer soundwave arcs -->
    <path d="M -148 -72 A 164 164 0 0 0 -148 72" fill="none" stroke="url(#remiGrad)" stroke-width="18" stroke-linecap="round" opacity="0.65"/>
    <path d="M -108 -48 A 118 118 0 0 0 -108 48" fill="none" stroke="url(#remiGrad)" stroke-width="18" stroke-linecap="round" opacity="0.9"/>
    <path d="M 148 -72 A 164 164 0 0 1 148 72" fill="none" stroke="url(#remiGrad)" stroke-width="18" stroke-linecap="round" opacity="0.65"/>
    <path d="M 108 -48 A 118 118 0 0 1 108 48" fill="none" stroke="url(#remiGrad)" stroke-width="18" stroke-linecap="round" opacity="0.9"/>

    <!-- Mic capsule -->
    <rect x="-46" y="-128" width="92" height="164" rx="46" fill="url(#remiGrad)"/>
    <!-- Subtle inner highlight -->
    <rect x="-28" y="-110" width="22" height="92" rx="11" fill="#FFFFFF" opacity="0.22"/>

    <!-- Mic cradle & stand -->
    <path d="M -78 -16 A 78 78 0 0 0 78 -16" fill="none" stroke="#F8FAFC" stroke-width="20" stroke-linecap="round"/>
    <line x1="0" y1="62" x2="0" y2="118" stroke="#F8FAFC" stroke-width="20" stroke-linecap="round"/>
    <line x1="-54" y1="118" x2="54" y2="118" stroke="#F8FAFC" stroke-width="20" stroke-linecap="round"/>
  </g>
</svg>
