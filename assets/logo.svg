<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="remiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C5CD9"/>
      <stop offset="50%" stop-color="#4A90E2"/>
      <stop offset="100%" stop-color="#00D2FF"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="108" fill="#12131A"/>
  <rect width="504" height="504" x="4" y="4" rx="104" fill="none" stroke="url(#remiGrad)" stroke-width="4" opacity="0.4"/>

  <!-- Core Soundwaves & Mic -->
  <g transform="translate(256, 230)" filter="url(#glow)">
    <!-- Outer wave pulse left -->
    <path d="M -150 -80 A 170 170 0 0 0 -150 80" fill="none" stroke="url(#remiGrad)" stroke-width="14" stroke-linecap="round" opacity="0.6"/>
    <path d="M -110 -55 A 120 120 0 0 0 -110 55" fill="none" stroke="url(#remiGrad)" stroke-width="14" stroke-linecap="round" opacity="0.85"/>
    
    <!-- Outer wave pulse right -->
    <path d="M 150 -80 A 170 170 0 0 1 150 80" fill="none" stroke="url(#remiGrad)" stroke-width="14" stroke-linecap="round" opacity="0.6"/>
    <path d="M 110 -55 A 120 120 0 0 1 110 55" fill="none" stroke="url(#remiGrad)" stroke-width="14" stroke-linecap="round" opacity="0.85"/>

    <!-- Central Microphone Capsule -->
    <rect x="-42" y="-95" width="84" height="150" rx="42" fill="url(#remiGrad)"/>
    <path d="M -66 -10 A 66 66 0 0 0 66 -10" fill="none" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round"/>
    <!-- Mic Stem & Base -->
    <line x1="0" y1="56" x2="0" y2="105" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round"/>
    <line x1="-50" y1="105" x2="50" y2="105" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round"/>
  </g>

  <!-- Title Text -->
  <text x="256" y="435" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="52" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">REMI</text>
  <text x="256" y="470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#7C5CD9" text-anchor="middle" letter-spacing="6">VOICE AI SUITE</text>
</svg>
